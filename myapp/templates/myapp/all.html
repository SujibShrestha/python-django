{% extends "layout.html" %}

{% block title %}
    All Apess
{% endblock %}

{% block content %}
    <h1 class="text-2xl font-bold bg-red-500 p-10">Apps</h1>
    <p>This is the home page content.</p>

    {% for app in apps  %}
<div class="bg-gray-100 p-4 mb-4">
   
<img src="{{app.image.url}}" alt="{{app.name}}" class="w-32 h-32 object-cover mb-2">
    <h2 class="text-xl text-amber-700 font-semibold">{{ app.name }}</h2>
    <p class="text-gray-600">Date: {{ app.date }}</p>
    
    <a href="{% url 'app_detail' app.id %}" class="inline-block bg-blue-500 text-white px-4 py-2 rounded mt-2">
        {{app.type}}- {{app.id}}
    </a>
</div>
{% endfor %}

{% endblock %}
